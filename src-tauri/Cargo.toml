[package]
name = "streamhub"
version = "2.0.0-alpha.1"
description = "StreamHub desktop: ad-free Twitch streams through Streamlink"
authors = ["DannyDarth"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "streamhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
