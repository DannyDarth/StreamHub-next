name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (test, installer, portable)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Build the ad blocking plugin (download, verify, patch)
        run: python plugin/build_plugin.py src-tauri/resources/streamlink-plugins
      - name: Test the plugin with Streamlink 8.3
        shell: bash
        env:
          STREAMHUB_TWITCH_PLUGIN: src-tauri/resources/streamlink-plugins/twitch.py
        run: |
          set -euo pipefail
          python -m pip install --quiet "streamlink==8.3.*" pytest
          python -m pytest -q plugin/tests
          streamlink --plugin-dirs src-tauri/resources/streamlink-plugins --help > help.txt
          for option in --twitch-proxy-playlist --twitch-proxy-playlist-fallback --twitch-backup-stream; do
            grep -q -- "$option" help.txt || { echo "::error::Streamlink is missing $option"; exit 1; }
          done

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build the frontend
        run: npm run build
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --all-targets

      - name: Build the installer
        run: npx tauri build --ci

      - name: Make the portable build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'StreamHub-next-portable'
          New-Item -ItemType Directory -Force $out | Out-Null
          $exe = Get-ChildItem src-tauri/target/release -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { throw 'No exe was built' }
          Copy-Item $exe.FullName "$out/StreamHub.exe"
          Copy-Item -Recurse src-tauri/resources/streamlink-plugins "$out/streamlink-plugins"
          @(
            'StreamHub (Tauri preview) - portable build'
            ''
            'Run StreamHub.exe. Keep the streamlink-plugins folder next to it: it has the Twitch ad blocking plugin.'
            'Needs Streamlink 8.3 or newer (https://streamlink.github.io) and the Microsoft Edge WebView2 runtime (built into Windows 10 and 11).'
            'Settings are stored per user by WebView2, not in this folder.'
          ) | Set-Content "$out/README.txt"
          Get-ChildItem -Recurse $out | Select-Object FullName, Length

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: StreamHub-next-Windows-x64-portable
          path: StreamHub-next-portable
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: StreamHub-next-Windows-x64-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
